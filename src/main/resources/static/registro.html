<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta - Shelfie</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>
<style>
	.formulario { max-width: 420px; margin: 24px auto; }
	.formulario .btn-enviar { width: 100%; margin-top: 8px; }
	.centrado { text-align: center; }

	.password-container { position: relative; }
	.password-container input { padding-right: 48px; }
	.password-toggle {
		position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
		width: 40px; height: 40px; padding: 0;
		background: transparent; border: 0; cursor: pointer;
		font-size: 20px; touch-action: none;
	}
</style>
</head>
<body>

<div id="navbar"></div>

<main class="contenedor">
	<section class="tarjeta formulario">

		<h1>Crear cuenta</h1>

		<form id="formRegistro">
			<div class="grupo">
				<label for="nombre">Nombre</label>
				<input type="text" id="nombre" autocomplete="name" required>
			</div>

			<div class="grupo">
				<label for="email">Correo electrónico</label>
				<input type="email" id="email" autocomplete="email" required>
			</div>

			<div class="grupo">
				<label for="password">Contraseña (mínimo 8 caracteres)</label>
				<div class="password-container">
					<input type="password" id="password" autocomplete="new-password" minlength="8" required>
					<!-- Muestra la contraseña solo mientras se pulsa -->
					<button type="button" id="mostrarPassword" class="password-toggle"
						aria-label="Mantener pulsado para mostrar contraseña" aria-pressed="false">👁️</button>
				</div>
			</div>

			<button type="submit" class="btn btn-enviar">Registrarse</button>
		</form>

		<p id="mensaje" class="msg centrado" role="status" aria-live="polite"></p>

		<p class="centrado">¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a></p>

	</section>
</main>

<script>
const mensaje = document.getElementById("mensaje");

document.getElementById("formRegistro").addEventListener("submit", async function (event) {
	event.preventDefault();

	const usuario = {
		nombre: document.getElementById("nombre").value,
		email: document.getElementById("email").value,
		password: document.getElementById("password").value
	};

	try {
		const respuesta = await fetch("/api/auth/registro", {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(usuario)
		});

		const texto = await respuesta.text();
		mensaje.textContent = texto;
		mensaje.className = "msg centrado " + (respuesta.ok ? "ok" : "error");

		if (respuesta.ok) {
			document.getElementById("formRegistro").reset();
			ocultarPassword();
		}
	} catch (error) {
		mensaje.className = "msg centrado error";
		mensaje.textContent = "No se pudo conectar con el servidor.";
	}
});

// ---------- Mostrar la contraseña mientras se mantiene pulsado ----------
const passwordInput = document.getElementById("password");
const botonOjo = document.getElementById("mostrarPassword");

function mostrarPassword() {
	passwordInput.type = "text";
	botonOjo.setAttribute("aria-pressed", "true");
}
function ocultarPassword() {
	passwordInput.type = "password";
	botonOjo.setAttribute("aria-pressed", "false");
}

botonOjo.addEventListener("pointerdown", function (event) {
	event.preventDefault();
	botonOjo.setPointerCapture(event.pointerId);
	mostrarPassword();
});
botonOjo.addEventListener("pointerup", ocultarPassword);
botonOjo.addEventListener("pointercancel", ocultarPassword);
botonOjo.addEventListener("lostpointercapture", ocultarPassword);

botonOjo.addEventListener("keydown", function (event) {
	if (event.key === " " || event.key === "Enter") {
		event.preventDefault();
		mostrarPassword();
	}
});
botonOjo.addEventListener("keyup", ocultarPassword);
botonOjo.addEventListener("blur", ocultarPassword);
</script>
</body>
</html>
