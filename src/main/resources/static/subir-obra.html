<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subir obra - Shelfie</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>
</head>
<body>

<div id="navbar"></div>

<main class="contenedor">

	<h1 id="tituloPagina">Subir nueva obra</h1>

	<!-- Avisos: motivo del rechazo, aviso de revalidación, errores de permisos... -->
	<div id="avisos"></div>

	<form id="formObra" class="tarjeta">

		<div class="grupo">
			<label for="titulo">Título</label>
			<input id="titulo" maxlength="255" required>
		</div>

		<div class="grupo">
			<label for="autor">Autor / creador de la obra</label>
			<input id="autor" maxlength="255">
		</div>

		<div class="grupo">
			<label for="tipo">Tipo</label>
			<select id="tipo">
				<option value="LIBRO">Libro</option>
				<option value="PELICULA">Película</option>
				<option value="SERIE">Serie</option>
				<option value="VIDEOJUEGO">Videojuego</option>
			</select>
		</div>

		<div class="grupo">
			<label for="descripcion">Descripción</label>
			<textarea id="descripcion" rows="6" maxlength="4000"></textarea>
		</div>

		<button type="submit" class="btn" id="guardar">Enviar para validación</button>
		<p id="msg" class="msg" role="status" aria-live="polite"></p>
	</form>

	<p><a href="/mis-obras.html">← Ver mis obras</a></p>

</main>

<script>
const $ = id => document.getElementById(id);
const JSON_HEADERS = { "Content-Type": "application/json" };

// Si la URL trae ?id=7 estamos EDITANDO la obra 7; si no, creando una nueva.
const obraId = Number(new URLSearchParams(window.location.search).get("id")) || null;

function mostrar(texto, correcto) {
	$("msg").textContent = texto;
	$("msg").className = "msg " + (correcto ? "ok" : "error");
}

// Texto de error del servidor, o uno genérico.
function textoError(r, defecto) {
	return typeof r.datos === "string" && r.datos ? r.datos : defecto;
}

// ---------- Modo edición: cargar la obra y comprobar permisos ----------
async function prepararEdicion() {
	$("tituloPagina").textContent = "Editar obra";
	$("guardar").textContent = "Guardar cambios";

	// La obra y su estado se piden a la vez. /validacion responde 403 si no eres el autor.
	const [obra, validacion] = await Promise.all([
		Shelfie.api("/work/" + obraId),
		Shelfie.apiSesion("/api/obras/" + obraId + "/validacion")
	]);

	if (!obra.ok) {
		$("formObra").hidden = true;
		$("avisos").innerHTML = '<p class="callout error">Esa obra no existe.</p>';
		return;
	}

	if (!validacion.ok) {
		$("formObra").hidden = true;
		$("avisos").innerHTML = '<p class="callout error">Solo el autor de la obra (o un moderador) puede editarla.</p>';
		return;
	}

	// Rellenamos el formulario con los datos actuales.
	$("titulo").value = obra.datos.titulo || "";
	$("autor").value = obra.datos.autor || "";
	$("tipo").value = obra.datos.tipo || "LIBRO";
	$("descripcion").value = obra.datos.descripcion || "";

	let avisos = '<p class="callout">Si cambias algo, la obra volverá a <b>revisarse</b> por un moderador antes de aparecer como validada.</p>';

	// Si la rechazaron, mostramos el motivo para que sepa qué corregir.
	if (validacion.datos.estado === "RECHAZADA" && validacion.datos.justificacion) {
		avisos = '<p class="callout error"><b>Motivo del rechazo:</b> ' +
			Shelfie.esc(validacion.datos.justificacion) + '</p>' + avisos;
	}

	$("avisos").innerHTML = avisos;
}

// ---------- Guardar (crear o editar) ----------
$("formObra").addEventListener("submit", async function (evento) {
	evento.preventDefault();

	const cuerpo = {
		titulo: $("titulo").value,
		autor: $("autor").value,
		tipo: $("tipo").value,
		descripcion: $("descripcion").value
	};

	$("guardar").disabled = true;

	const r = await Shelfie.apiSesion(
		obraId ? "/api/obras/" + obraId : "/api/obras",
		{ method: obraId ? "PUT" : "POST", headers: JSON_HEADERS, body: JSON.stringify(cuerpo) });

	$("guardar").disabled = false;

	if (!r.ok) {
		mostrar(textoError(r, "No se ha podido guardar la obra."), false);
		return;
	}

	const texto = obraId
		? "Cambios guardados. La obra volverá a ser revisada por un moderador."
		: "Obra enviada para validación.";

	// Mensaje con enlace a la pantalla de estado de validación.
	$("msg").className = "msg ok";
	$("msg").innerHTML = Shelfie.esc(texto) +
		' <a href="/estado-validacion.html?id=' + Number(r.datos.id) + '">Ver estado de validación</a>';

	if (!obraId) { $("formObra").reset(); }
});

if (obraId) { prepararEdicion(); }
</script>

</body>
</html>
