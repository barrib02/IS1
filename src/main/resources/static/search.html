<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscar - Shelfie</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>
<style>
.portada-obra {
	display: block;
	width: 100%;
	height: 200px;
	object-fit: contain;
	border-radius: 8px;
	margin-bottom: 12px;
}
</style>

</head>
<body>

	<!-- La barra superior (logo, enlaces y avatar) la pinta shelfie.js -->
	<div id="navbar"></div>

	<main class="contenedor">

		<h1>Buscar</h1>

		<!-- Cambiar entre buscar obras o listas públicas -->
		<div class="pestanas">
			<button type="button" class="pestana activa" id="modoObras"
				aria-pressed="true">Obras</button>
			<button type="button" class="pestana" id="modoListas"
				aria-pressed="false">Listas</button>
		</div>

		<div class="barra-busqueda">
			<div class="campo-sug">
				<input type="search" id="titulo" placeholder="Busca por título…"
					autocomplete="off" aria-label="Texto a buscar">
				<div id="sugerencias" class="sugerencias" hidden></div>
			</div>

			<select id="tipo" aria-label="Tipo de obra">
				<option value="">Todos los tipos</option>
				<option value="LIBRO">Libro</option>
				<option value="PELICULA">Película</option>
				<option value="SERIE">Serie</option>
				<option value="VIDEOJUEGO">Videojuego</option>
			</select>

			<button type="button" id="buscar" class="btn">Buscar</button>
		</div>

		<h2 id="encabezado">Obras recientes</h2>
		<p id="estado" class="msg" role="status"></p>
		<div id="resultados" class="rejilla"></div>

	</main>

	<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;

let modo = "obras";        // "obras" o "listas"
let numeroPeticion = 0;    // sirve para ignorar respuestas antiguas
let controladorSug = null; // permite cancelar la petición de sugerencias anterior

const NOMBRE_TIPO = Shelfie.NOMBRE_TIPO;
const NOMBRE_PLURAL = { LIBRO: "libros", PELICULA: "películas", SERIE: "series", VIDEOJUEGO: "videojuegos" };

// ---------- Cambio de pestaña ----------
function cambiarModo(nuevo) {
	modo = nuevo;
	$("modoObras").classList.toggle("activa", nuevo === "obras");
	$("modoListas").classList.toggle("activa", nuevo === "listas");
	$("modoObras").setAttribute("aria-pressed", String(nuevo === "obras"));
	$("modoListas").setAttribute("aria-pressed", String(nuevo === "listas"));
	$("tipo").hidden = (nuevo !== "obras");   // el filtro de tipo solo vale para obras
	$("titulo").placeholder = nuevo === "obras" ? "Busca por título…" : "Busca una lista…";
	ocultarSugerencias();
	ejecutar();
}

// ---------- Petición común ----------
// Devuelve un array (vacío si hay error) y escribe el estado en pantalla.
async function pedir(url) {
	$("estado").className = "msg";
	$("estado").textContent = "Cargando…";

	const r = await Shelfie.api(url);

	if (r.status === 401 || r.status === 403) {
		$("estado").className = "msg error";
		$("estado").innerHTML = 'Inicia sesión para ver las listas. <a href="/login.html">Iniciar sesión</a>';
		return [];
	}
	if (!r.ok || !Array.isArray(r.datos)) {
		$("estado").className = "msg error";
		$("estado").textContent = "No se ha podido cargar. Inténtalo de nuevo.";
		return [];
	}

	$("estado").textContent = "";
	return r.datos;
}

// ---------- Buscar (botón, Intro o cambio de filtro) ----------
async function ejecutar() {
	const texto = $("titulo").value.trim();
	const tipo = $("tipo").value;
	const miPeticion = ++numeroPeticion;
	ocultarSugerencias();

	let datos;

	if (modo === "obras") {
		if (!texto) {
			// Sin texto: Discover con estantes (filtrado por tipo si hay uno elegido).
			$("encabezado").textContent = tipo ? "Descubre " + NOMBRE_PLURAL[tipo] : "Descubre";
			datos = await pedir("/explorar/estantes" + (tipo ? "?tipo=" + enc(tipo) : ""));
			if (miPeticion === numeroPeticion) { pintarEstantes(datos); }

		} else {
		    $("encabezado").textContent = "Resultados";

		    if (tipo === "LIBRO") {
		        // Buscamos libros en Google Books.
		        $("estado").className = "msg";
		        $("estado").textContent = "Buscando libros…";

		        try {
		            const respuesta = await Shelfie.api(
		                "/api/googlebooks/buscar?titulo=" + enc(texto)
		            );

		            if (miPeticion !== numeroPeticion) return;

		            if (!respuesta.ok) {
		                throw new Error("Error al consultar Google Books");
		            }

		            datos = adaptarLibrosGoogle(respuesta.datos || {});
		            $("estado").textContent = "";
		        } catch (error) {
		            if (miPeticion !== numeroPeticion) return;

		            datos = [];
		            $("estado").className = "msg error";
		            $("estado").textContent = "No se han podido buscar los libros.";
		        }
		    } else {
		        // Mantenemos las búsquedas actuales para los demás tipos.
		        datos = await pedir(
		            "/search?titulo=" + enc(texto) + "&tipo=" + enc(tipo)
		        );
		    }

		    if (miPeticion === numeroPeticion) {
		        pintarObras(datos);
		    }
		}

	} else {
		if (!texto) {
			$("encabezado").textContent = "Listas públicas";
			datos = await pedir("/api/listas/publicas");
		} else {
			$("encabezado").textContent = "Resultados";
			datos = await pedir("/api/listas/buscar?texto=" + enc(texto));
		}
		if (miPeticion === numeroPeticion) { pintarListas(datos); }
	}
}

// ---------- Pintar resultados ----------

function adaptarLibrosGoogle(datos) {
    return (datos.items || []).map(libro => ({
        fuenteApi: "GOOGLE_BOOKS",
        idExterno: libro.id,
        tipo: "LIBRO",
        titulo: libro.volumeInfo?.title || "Sin título",
        autor: (libro.volumeInfo?.authors || []).join(", "),
        descripcion: libro.volumeInfo?.description || "",
        portada: libro.volumeInfo?.imageLinks?.thumbnail || null
    }));
}



/**
 * Genera el enlace de una obra.
 * Las obras de Neon utilizan su ID interno.
 * Las obras externas de TMDB utilizan su ID externo.
 */
 
 function enlaceObra(obra) {

	    // Obras procedentes de APIs externas.
	    if (
	        obra.idExterno &&
	        (
	            (obra.fuenteApi === "GOOGLE_BOOKS" && obra.tipo === "LIBRO") ||
	            (obra.fuenteApi === "TMDB" &&
	                ["PELICULA", "SERIE"].includes(obra.tipo))
	        )
	    ) {
	        const parametros = new URLSearchParams({
	            fuente: obra.fuenteApi,
	            tipo: obra.tipo,
	            idExterno: obra.idExterno
	        });

	        return "/work.html?" + parametros.toString();
	    }

	    // Obras originales almacenadas en Neon.
	    if (obra.id != null) {
	        return "/work.html?id=" + encodeURIComponent(obra.id);
	    }

	    return "/search.html";
	}
 function pintarObras(obras) {

	    const caja = $("resultados");
	    caja.className = "rejilla";

	    if (obras.length === 0) {
	        caja.innerHTML =
	            '<p class="vacio">No hay obras con esos criterios. Prueba con otro título o quita el filtro de tipo.</p>';
	        return;
	    }

	    caja.innerHTML = obras.map(o => `
	        <article class="tarjeta-obra ${Shelfie.claseTipo(o.tipo)}">

	            ${portadaObra(o)}

	            ${Shelfie.chipTipo(o.tipo)}

	            <h3>
	                <a href="${enlaceObra(o)}">
	                    ${Shelfie.esc(o.titulo)}
	                </a>
	            </h3>

	        </article>
	    `).join("");
	}
//Genera la portada de una obra cuando está disponible.
function portadaObra(obra) {

    const imagen = obra.imagenUrl || obra.portada;

    if (!imagen) {
        return "";
    }

    const url = imagen.replace(/^http:/, "https:");

    if (!url.startsWith("https://")) {
        return "";
    }

    return `
        <a href="${enlaceObra(obra)}">
            <img
                class="portada-obra"
                src="${Shelfie.esc(url)}"
                alt="Portada de ${Shelfie.esc(obra.titulo)}"
                loading="lazy">
        </a>
    `;
}

function pintarListas(listas) {
	const caja = $("resultados");
		caja.className = "rejilla";
	if (listas.length === 0) {
		caja.innerHTML = '<p class="vacio">No hay listas públicas con esos criterios.</p>';
		return;
	}
	caja.innerHTML = listas.map(l => `
		<article class="tarjeta-obra">
			<h3><a href="/lista.html?id=${l.id}">${Shelfie.esc(l.nombre)}</a></h3>
			<p>Creada por ${Shelfie.esc(l.creador)}</p>
			<p>${Shelfie.esc(l.descripcion || "")}</p>
		</article>`).join("");
}

//Pinta los estantes con obras externas e internas.
function pintarEstantes(estantes) {

    const caja = $("resultados");
    caja.className = "";

    if (estantes.length === 0) {
        caja.innerHTML =
            '<p class="vacio">Todavía no hay obras para descubrir.</p>';
        return;
    }

    caja.innerHTML = estantes.map(e => `
        <section class="estante">

            <h2>${Shelfie.esc(e.titulo)}</h2>

            <p class="subtitulo">
                ${Shelfie.esc(e.subtitulo)}
            </p>

            <div class="fila">

                ${e.obras.map(o => `
                    <article class="tarjeta-obra ${Shelfie.claseTipo(o.tipo)}">

                        ${portadaObra(o)}

                        ${Shelfie.chipTipo(o.tipo)}

                        <h3>
                            <a href="${enlaceObra(o)}">
                                ${Shelfie.esc(o.titulo)}
                            </a>
                        </h3>

                    </article>
                `).join("")}

            </div>

        </section>
    `).join("");
}

// ---------- Sugerencias mientras se escribe ----------
function ocultarSugerencias() {
	$("sugerencias").hidden = true;
	$("sugerencias").innerHTML = "";
}

async function sugerir() {
	const texto = $("titulo").value.trim();
	if (texto.length < 2) { ocultarSugerencias(); return; }

	// Cancelamos la petición anterior si seguía en curso.
	if (controladorSug) { controladorSug.abort(); }
	controladorSug = new AbortController();

	const url = modo === "obras"
		? "/sugerencias?texto=" + enc(texto)
		: "/api/listas/sugerencias?texto=" + enc(texto);

	try {
		const r = await Shelfie.api(url, { signal: controladorSug.signal });
		if (!r.ok || !Array.isArray(r.datos) || r.datos.length === 0) { ocultarSugerencias(); return; }


		$("sugerencias").innerHTML = r.datos.map(item => {

		    // Las sugerencias de listas mantienen su funcionamiento.
		    if (modo === "listas") {
		        return `<a href="/lista.html?id=${item.id}">
		            ${Shelfie.esc(item.nombre)}
		        </a>`;
		    }

		    // Las obras guardadas en Neon tienen un ID interno.
		    if (item.id != null) {
		        return `<a href="/work.html?id=${encodeURIComponent(item.id)}">
		            ${Shelfie.esc(item.titulo)}
		        </a>`;
		    }

		    // Las obras externas todavía no tienen ficha propia.
		    // Al seleccionarlas, mostramos sus resultados de búsqueda.
		    return `<a href="#" class="sugerencia-externa"
		        data-titulo="${Shelfie.esc(item.titulo)}">
		        ${Shelfie.esc(item.titulo)}
		        (${Shelfie.esc(Shelfie.NOMBRE_TIPO[item.tipo] || item.tipo)})
		    </a>`;

		}).join("");

		$("sugerencias").hidden = false;
	} catch (e) {
		// AbortError: la petición se canceló a propósito; no hay que hacer nada.
	}
}


//Permite seleccionar sugerencias de obras externas.
$("sugerencias").addEventListener("click", e => {

 const enlace = e.target.closest(".sugerencia-externa");

 if (!enlace) return;

 e.preventDefault();

 // Copiamos el título seleccionado al buscador.
 $("titulo").value = enlace.dataset.titulo;

 // Mostramos los resultados de esa búsqueda.
 ejecutar();
});


// ---------- Eventos ----------
$("buscar").addEventListener("click", ejecutar);
$("modoObras").addEventListener("click", () => cambiarModo("obras"));
$("modoListas").addEventListener("click", () => cambiarModo("listas"));
$("tipo").addEventListener("change", ejecutar);                      // filtrar al elegir tipo
$("titulo").addEventListener("input", Shelfie.debounce(sugerir, 250)); // 1 petición cada 250 ms como mucho

$("titulo").addEventListener("keydown", e => {
	if (e.key === "Enter") { e.preventDefault(); ejecutar(); }       // buscar con Intro
	if (e.key === "Escape") { ocultarSugerencias(); }
});

// Cerrar las sugerencias al pulsar fuera del buscador.
document.addEventListener("click", e => {
	if (!e.target.closest(".campo-sug")) { ocultarSugerencias(); }
});

// Si llegamos con ?tipo=LIBRO o ?q=texto (desde la barra superior), los aplicamos.
const params = new URLSearchParams(window.location.search);
if (params.get("tipo")) { $("tipo").value = params.get("tipo"); }
if (params.get("q")) { $("titulo").value = params.get("q"); }
ejecutar();
</script>

</body>
</html>
