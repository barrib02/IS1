<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscador</title>
</head>
<body>
	<button type="button" onclick="window.location.href='perfil.html'">
		Mi perfil</button>
	<h1>Buscar obras</h1>

	<p>

	    <button id="modoObras">
	        Obras
	    </button>

	    <button id="modoListas">
	        Listas
	    </button>

	</p>

	
	
	<input type="text" id="titulo" placeholder="Buscar obra">

	<div id="sugerencias"></div>

	<button id="buscar">Buscar</button>

	<br>
	<br>

	<select id="tipo">

		<option value="">Todos</option>

		<option value="LIBRO">Libro</option>

		<option value="PELICULA">Película</option>

		<option value="SERIE">Serie</option>

		<option value="VIDEOJUEGO">Videojuego</option>

	</select>

	<hr>

	<div id="resultados"></div>

	<script>

document.getElementById("buscar")
.addEventListener("click", buscar);

document
.getElementById("modoObras")
.addEventListener("click", () => {

    modo = "obras";

});

document
.getElementById("modoListas")
.addEventListener("click", () => {

    modo = "listas";

});

document
.getElementById("titulo")
.addEventListener("input", sugerir);

async function buscar() {

    const texto =
        document
        .getElementById("titulo")
        .value;

    if(modo === "obras") {

        const tipo =
            document
            .getElementById("tipo")
            .value;

        const respuesta =
            await fetch(
                "/search?titulo="
                + encodeURIComponent(texto)
                + "&tipo="
                + encodeURIComponent(tipo)
            );

        const obras =
            await respuesta.json();

        mostrarResultados(obras);

    } else {

        const respuesta =
            await fetch(
                "/api/listas/buscar?texto="
                + encodeURIComponent(texto)
            );

        const listas =
            await respuesta.json();

        mostrarResultadosListas(listas);

    }
}

async function sugerir(){

    const texto =
        document.getElementById("titulo").value;

    if(texto.length < 2){

        document.getElementById(
            "sugerencias"
        ).innerHTML = "";

        return;
    }

    if(modo === "obras"){

        const respuesta =
            await fetch(
                "/sugerencias?texto="
                + encodeURIComponent(texto)
            );

        const obras =
            await respuesta.json();

        mostrarSugerencias(obras);

    }else{

        const respuesta =
            await fetch(
                "/api/listas/sugerencias?texto="
                + encodeURIComponent(texto)
            );

        const listas =
            await respuesta.json();

        mostrarSugerenciasListas(listas);

    }

}

function mostrarSugerencias(obras){

    const div =
        document.getElementById(
            "sugerencias"
        );

    div.innerHTML = "";

    obras.forEach(obra => {

        div.innerHTML +=
        `
        <div
            onclick="abrirObra(${obra.id})"
            style="
                cursor:pointer;
                padding:5px;
                border-bottom:1px solid lightgray;
            ">

            ${obra.titulo}

        </div>
        `;
    });
}

function mostrarSugerenciasListas(listas){

    const div =
        document.getElementById(
            "sugerencias"
        );

    div.innerHTML = "";

    listas.forEach(lista => {

        div.innerHTML +=
        `
        <div
            onclick="abrirLista(${lista.id})"
            style="
                cursor:pointer;
                padding:5px;
                border-bottom:1px solid lightgray;
            ">

            ${lista.nombre}

        </div>
        `;

    });

}

function abrirObra(id){

    window.location.href =
        "/work.html?id=" + id;
}

function abrirLista(id){

    window.location.href =
        "lista.html?id=" + id;

}

function mostrarResultados(obras) {

    const div =
        document.getElementById("resultados");

    div.innerHTML = "";

    if(obras.length === 0){

        div.innerHTML =
            "<p>No se encontraron resultados</p>";

        return;
    }

    obras.forEach(obra => {

        div.innerHTML +=
        `
        <div>

			<h3>
			    <a href="/work.html?id=${obra.id}">
			        ${obra.titulo}
			    </a>
			</h3>

            <p>${obra.tipo}</p>

        </div>
        <hr>
        `;
    });
}

function mostrarResultadosListas(listas) {

    const div =
        document.getElementById(
            "resultados"
        );

    div.innerHTML = "";

    if(listas.length === 0){

        div.innerHTML =
        "<p>No se encontraron listas</p>";

        return;
    }

    listas.forEach(lista => {

        div.innerHTML += `

        <div>

            <h3>

                <a href="lista.html?id=${lista.id}">
                    ${lista.nombre}
                </a>

            </h3>

            <p>
                Creador:
                ${lista.creador}
            </p>

            <p>
                ${lista.descripcion ?? ""}
            </p>

        </div>

        <hr>
        `;

    });

}

</script>

</body>
</html>
