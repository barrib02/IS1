<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="referrer" content="no-referrer">

<title>Restablecer contraseña - Shelfie</title>

<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>

<style>
.formulario {
	max-width: 420px;
	margin: 24px auto;
}

.formulario .btn {
	width: 100%;
	margin-top: 8px;
}

.centrado {
	text-align: center;
}
</style>

</head>

<body>

	<div id="navbar"></div>

	<main class="contenedor">

		<section class="tarjeta formulario">

			<h1>Nueva contraseña</h1>

			<p>Elige una nueva contraseña para tu cuenta de Shelfie.</p>

			<form id="formPassword">

				<div class="grupo">

					<label for="password">Nueva contraseña</label> <input
						type="password" id="password" autocomplete="new-password"
						minlength="8" maxlength="72" required>

				</div>

				<div class="grupo">

					<label for="confirmar"> Repite la contraseña </label> <input
						type="password" id="confirmar" autocomplete="new-password"
						minlength="8" maxlength="72" required>

				</div>

				<button type="submit" class="btn" id="guardar">Cambiar
					contraseña</button>

			</form>

			<p id="mensaje" class="msg centrado" role="status"></p>

			<p class="centrado">
				<a href="/recuperar-password.html"> Solicitar otro enlace </a>
			</p>

			<p class="centrado">
				<a href="/login.html">Volver a iniciar sesión</a>
			</p>

		</section>

	</main>

	<script>

const token = new URLSearchParams(
    window.location.search
).get("token");

// Retiramos el token de la barra de direcciones.
history.replaceState(
    null, "", "/restablecer-password.html"
);

const formulario = document.getElementById("formPassword");
const mensaje = document.getElementById("mensaje");
const boton = document.getElementById("guardar");

function mostrar(texto, correcto) {

    mensaje.textContent = texto;

    mensaje.className = correcto
        ? "msg centrado ok"
        : "msg centrado error";
}

if (!token || !/^[A-Za-z0-9_-]{43}$/.test(token)) {

    formulario.hidden = true;

    mostrar("El enlace de recuperación no es válido.", false);
}

formulario.addEventListener("submit", async event => {

    event.preventDefault();

    const password = document.getElementById("password").value;

    const confirmar = document.getElementById("confirmar").value;

    if (password !== confirmar) {

        mostrar("Las contraseñas no coinciden.", false);
        return;
    }

    if (new TextEncoder().encode(password).length > 72) {

        mostrar("La contraseña es demasiado larga.", false);
        return;
    }

    boton.disabled = true;

    try {

        const respuesta = await fetch(
            "/api/auth/restablecer-password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    password: password
                })
            }
        );

        if (respuesta.ok) {

            formulario.reset();
            formulario.hidden = true;

            mostrar(await respuesta.text(), true);

        } else {

            const texto = await respuesta.text();

            mostrar(
                respuesta.status === 400 &&
                !texto.startsWith("{")
                    ? texto
                    : "No se ha podido restablecer la contraseña.",
                false
            );
        }

    } catch (error) {

        mostrar(
            "No se ha podido conectar con el servidor.",
            false
        );

    } finally {

        boton.disabled = false;
    }
});
S
</script>

</body>
</html>
