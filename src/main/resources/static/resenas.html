<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reseñas - Shelfie</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>
<style>
	.acciones { display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>

<div id="navbar"></div>

<main class="contenedor">

	<section class="tarjeta">
		<h1>Escribir una reseña</h1>

		<div class="grupo">
			<label for="obraId">ID de la obra</label>
			<input type="number" id="obraId" min="1" value="1">
		</div>

		<div class="grupo">
			<label for="textoResena">Tu reseña</label>
			<textarea id="textoResena" placeholder="Escribe aquí tu opinión sobre la obra…"></textarea>
			<small id="contador">0 / 200 palabras</small>
		</div>

		<button type="button" class="btn" id="guardarResena">Guardar reseña</button>
	</section>

	<section class="tarjeta">
		<h2>Editar o eliminar una reseña</h2>

		<div class="grupo">
			<label for="resenaId">ID de la reseña</label>
			<input type="number" id="resenaId" min="1">
		</div>

		<div class="acciones">
			<button type="button" class="btn" id="editarResena">Editar reseña</button>
			<button type="button" class="btn btn-peligro" id="eliminarResena">Eliminar reseña</button>
		</div>

		<p id="mensaje" class="msg" role="status" aria-live="polite"></p>
	</section>

</main>

<script>
const JSON_HEADERS = { "Content-Type": "application/json" };
const textoResena = document.getElementById("textoResena");
const contador = document.getElementById("contador");
let usuarioId = null;

Shelfie.obtenerPerfil().then(perfil => { if (perfil) { usuarioId = perfil.id; } });

function mostrar(texto, correcto) {
	const mensaje = document.getElementById("mensaje");
	mensaje.textContent = texto;
	mensaje.className = "msg " + (correcto ? "ok" : "error");
}

function contarPalabras() {
	const texto = textoResena.value.trim();
	const palabras = texto === "" ? 0 : texto.split(/\s+/).length;
	contador.textContent = palabras + " / 200 palabras";
	contador.style.color = palabras > 200 ? "var(--error)" : "inherit";
	return palabras;
}
textoResena.addEventListener("input", contarPalabras);

// Comprueba el texto antes de enviarlo; devuelve true si es válido.
function textoValido() {
	const palabras = contarPalabras();
	if (palabras === 0) { mostrar("La reseña no puede estar vacía.", false); return false; }
	if (palabras > 200) { mostrar("La reseña no puede superar las 200 palabras.", false); return false; }
	return true;
}

document.getElementById("guardarResena").addEventListener("click", async function () {
	const obraId = Number(document.getElementById("obraId").value);

	if (usuarioId === null) { mostrar("Inicia sesión para escribir una reseña.", false); return; }
	if (!Number.isInteger(obraId) || obraId < 1) { mostrar("Introduce un ID de obra válido.", false); return; }
	if (!textoValido()) { return; }

	const r = await Shelfie.api("/api/resenas", {
		method: "POST", headers: JSON_HEADERS,
		body: JSON.stringify({ obraId, usuarioId, texto: textoResena.value.trim() })
	});

	if (r.ok) {
		mostrar("¡Reseña guardada correctamente! ID: " + r.datos.id, true);
	} else {
		mostrar(typeof r.datos === "string" && r.datos ? r.datos : "Error al guardar la reseña.", false);
	}
});

document.getElementById("editarResena").addEventListener("click", async function () {
	const resenaId = Number(document.getElementById("resenaId").value);

	if (!Number.isInteger(resenaId) || resenaId < 1) { mostrar("Introduce un ID de reseña válido.", false); return; }
	if (!textoValido()) { return; }

	const r = await Shelfie.api("/api/resenas/" + resenaId, {
		method: "PUT", headers: JSON_HEADERS,
		body: JSON.stringify({ texto: textoResena.value.trim() })
	});

	mostrar(r.ok ? "¡Reseña editada correctamente!" : "Error al editar la reseña. Comprueba el ID.", r.ok);
});

document.getElementById("eliminarResena").addEventListener("click", async function () {
	const resenaId = Number(document.getElementById("resenaId").value);

	if (!Number.isInteger(resenaId) || resenaId < 1) { mostrar("Introduce un ID de reseña válido.", false); return; }
	if (!confirm("¿Seguro que quieres eliminar esta reseña?")) { return; }

	const r = await Shelfie.api("/api/resenas/" + resenaId, { method: "DELETE" });

	mostrar(r.ok ? "¡Reseña eliminada correctamente!" : "Error al eliminar la reseña. Comprueba el ID.", r.ok);
});
</script>
</body>
</html>
