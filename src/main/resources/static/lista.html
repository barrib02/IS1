<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista - Shelfie</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>
<style>
	.acciones-lista { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
	.btn-sec.oscuro { color: var(--tinta); }
	.btn-sec.oscuro:hover { background: var(--fondo); }
	.lista-fila .titulo { flex: 1; min-width: 150px; font-weight: bold; }
	.lista-fila a { text-decoration: none; }
	.lista-fila a:hover { text-decoration: underline; }
	.btn-peq { padding: 6px 12px; font-size: 0.85rem; }
</style>
</head>
<body>

<div id="navbar"></div>

<main class="contenedor">

	<p><a href="/perfil.html">← Volver a mi perfil</a></p>

	<p id="mensaje" class="msg" role="status" aria-live="polite"></p>

	<section class="tarjeta">
		<h1 id="nombreLista">Lista</h1>
		<p id="creadorLista"></p>
		<p id="descripcionLista"></p>

		<div class="acciones-lista">
			<button type="button" class="btn btn-sec oscuro" id="copiarEnlace">Copiar enlace</button>
			<button type="button" class="btn" id="compartir">Compartir</button>
		</div>

		<p>
			<span id="visibilidad" class="chip"></span>
			<span id="contador"></span>
		</p>

		<div id="obras"></div>
	</section>

</main>

<script>
const $ = id => document.getElementById(id);
const listaId = new URLSearchParams(window.location.search).get("id");
let lista = null;

// Llama a la API. Sin sesión redirige al login; si hay error lanza su mensaje.
async function api(url, opciones) {
	const r = await Shelfie.api(url, opciones);

	if (r.status === 401 || r.status === 403) {
		window.location.href = "/login.html";
		throw new Error("Debes iniciar sesión.");
	}
	if (!r.ok) {
		throw new Error(typeof r.datos === "string" && r.datos ? r.datos : "Error " + r.status);
	}
	return r.datos;
}

function mostrar(texto, correcto) {
	$("mensaje").textContent = texto;
	$("mensaje").className = "msg " + (correcto ? "ok" : "error");
}

function crear(etiqueta, texto, clase) {
	const el = document.createElement(etiqueta);
	if (texto !== undefined) { el.textContent = texto; }
	if (clase) { el.className = clase; }
	return el;
}

function pintar() {
	$("nombreLista").textContent = lista.nombre;
	$("creadorLista").textContent = "Creador: " + lista.creador;
	$("descripcionLista").textContent = lista.descripcion || "";
	document.title = lista.nombre + " - Shelfie";

	$("visibilidad").textContent = lista.publica ? "Pública" : "Privada";
	$("visibilidad").className = lista.publica ? "chip genero" : "chip";

	const n = lista.obras.length;
	$("contador").textContent = " " + n + (n === 1 ? " obra" : " obras");

	const contenedor = $("obras");
	contenedor.innerHTML = "";

	if (n === 0) {
		contenedor.appendChild(crear("p", "Esta lista todavía no tiene obras.", "vacio"));
		return;
	}

	lista.obras.forEach(obra => {
		const fila = crear("div", undefined, "lista-fila");

		const titulo = crear("span", undefined, "titulo");
		const enlace = crear("a", obra.titulo);
		enlace.href = "/work.html?id=" + obra.id;
		titulo.appendChild(enlace);
		fila.appendChild(titulo);

		fila.appendChild(crear("span", Shelfie.formatearEnum(obra.tipo), "chip"));

		// Solo el dueño puede quitar obras.
		if (lista.mia) {
			const quitar = crear("button", "Quitar", "btn btn-peligro btn-peq");
			quitar.type = "button";
			quitar.addEventListener("click", () => quitarObra(obra));
			fila.appendChild(quitar);
		}

		contenedor.appendChild(fila);
	});
}

async function quitarObra(obra) {
	if (!confirm("¿Quitar \"" + obra.titulo + "\" de la lista?")) { return; }

	try {
		await api("/api/listas/" + listaId + "/obras/" + obra.id, { method: "DELETE" });
		await cargar();
		mostrar("Obra eliminada de la lista.", true);
	} catch (error) {
		mostrar(error.message, false);
	}
}

async function cargar() {
	lista = await api("/api/listas/" + listaId);
	pintar();
}

async function iniciar() {
	if (!listaId) {
		mostrar("Falta el identificador de la lista.", false);
		return;
	}
	try {
		await cargar();
	} catch (error) {
		mostrar(error.message, false);
	}
}

$("copiarEnlace").addEventListener("click", async function () {
	try {
		await navigator.clipboard.writeText(window.location.href);
		mostrar("Enlace copiado.", true);
	} catch (e) {
		mostrar("No se ha podido copiar el enlace.", false);
	}
});

$("compartir").addEventListener("click", async function () {
	if (!navigator.share) {
		mostrar("Tu navegador no permite compartir. Usa Copiar enlace.", false);
		return;
	}
	try {
		await navigator.share({
			title: lista ? lista.nombre : "Lista de Shelfie",
			text: "Mira esta lista de Shelfie",
			url: window.location.href
		});
	} catch (e) { /* el usuario canceló */ }
});

iniciar();
</script>
</body>
</html>
