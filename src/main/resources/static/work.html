<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de obra - Shelfie</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>
</head>
<body>

<div id="navbar"></div>

<main class="contenedor">
	<!-- Aquí se pinta la ficha (título, creador, tipo, géneros, descripción, mi experiencia) -->
	<div id="contenido"></div>

	<!-- Favoritos y listas (solo con sesión) -->
	<section id="acciones" class="tarjeta" hidden></section>
</main>

<script>
const $ = id => document.getElementById(id);
const obraId = Number(new URLSearchParams(window.location.search).get("id"));
const JSON_HEADERS = { "Content-Type": "application/json" };

let usuarioId = null;      // id del usuario con sesión
let valoracionId = null;   // id de mi valoración (si ya existe) para hacer PUT en vez de POST
let resenaId = null;       // id de mi reseña (si ya existe)
let estrellas = null;      // control de estrellas
let tipoObra = null;       // LIBRO, SERIE...

// Crea un elemento con texto seguro (sin innerHTML).
function crear(etiqueta, texto, clase) {
	const el = document.createElement(etiqueta);
	if (texto !== undefined) { el.textContent = texto; }
	if (clase) { el.className = clase; }
	return el;
}

// Mensaje bajo el formulario de "Mi experiencia".
function mostrar(texto, correcto, id) {
	const msg = $(id || "msg");
	msg.textContent = texto;
	msg.className = "msg " + (correcto ? "ok" : "error");
}

// Si el servidor devolvió un texto de error lo usamos; si no, uno genérico.
function textoError(r, defecto) {
	return typeof r.datos === "string" && r.datos ? r.datos : defecto;
}

// ======================================================
// 1) Arranque: la obra y el perfil se piden A LA VEZ
// ======================================================
async function iniciar() {
	if (!Number.isInteger(obraId) || obraId < 1) {
		$("contenido").innerHTML = '<div class="tarjeta"><h2>Falta la obra</h2><p>Entra desde el buscador o con <code>/work.html?id=1</code>.</p></div>';
		return;
	}

	const [respuestaObra, perfil] = await Promise.all([
		Shelfie.api("/work/" + obraId),
		Shelfie.obtenerPerfil()          // la navbar reutiliza esta misma petición
	]);

	if (!respuestaObra.ok) {
		$("contenido").innerHTML = '<div class="tarjeta"><h2>Obra no encontrada</h2><p>No existe ninguna obra con el ID ' +
			Shelfie.esc(obraId) + '. <a href="/search.html">Volver al buscador</a></p></div>';
		return;
	}

	pintarObra(respuestaObra.datos);

	// Sin sesión la ficha es pública, pero no se puede interactuar.
	if (!perfil) {
		$("experiencia").innerHTML = '<p>Inicia sesión para valorar, reseñar y guardar esta obra. ' +
			'<a href="/login.html">Iniciar sesión</a></p>';
		return;
	}

	usuarioId = perfil.id;
	prepararExperiencia();

	// Estado, valoración, reseña, favoritos y listas: 5 peticiones en paralelo.
	await Promise.all([cargarInteracciones(), pintarAcciones(), cargarProgreso()]);
}

// ======================================================
// 2) Ficha de la obra
// ======================================================
function pintarObra(obra) {
	tipoObra = obra.tipo;
	document.title = obra.titulo + " - Shelfie";

	const creador = obra.creador
		? `<a href="/creador.html?id=${obra.creador.id}">${Shelfie.esc(obra.creador.nombre)}</a>`
		: Shelfie.esc(obra.autor || "Desconocido");

	// Géneros como etiquetas (el backend ya los envía en obra.generos).
	const generos = (obra.generos && obra.generos.length)
		? obra.generos.map(g => `<span class="chip genero">${Shelfie.esc(Shelfie.formatearEnum(g))}</span>`).join("")
		: '<span class="vacio">Sin géneros indicados</span>';

	$("contenido").innerHTML = `
		<article class="tarjeta">
			<div class="titulo-fila">
				<h1>${Shelfie.esc(obra.titulo)}</h1>
				<span id="zona-fav"></span>
			</div>
			<p><b>Creador:</b> ${creador}</p>
			<p><b>Tipo:</b> ${Shelfie.chipTipo(obra.tipo)}
				${obra.anio ? " · <b>Año:</b> " + Shelfie.esc(obra.anio) : ""}</p>
			<div><b>Géneros:</b><div style="margin-top:6px">${generos}</div></div>
			<p>${Shelfie.esc(obra.descripcion || "")}</p>

			<section id="experiencia" style="margin-top:24px;padding-top:20px;border-top:1px solid var(--borde)">
				<h3>Mi experiencia</h3>

				<div class="grupo">
					<label for="estado">Estado</label>
					<select id="estado">
						<option value="">Selecciona un estado…</option>
						<option value="PENDIENTE">Pendiente</option>
						<option value="EN_CURSO">En curso</option>
						<option value="COMPLETADA">Completada</option>
						<option value="ABANDONADA">Abandonada</option>
					</select>
					<div class="grupo" id="grupoFecha" hidden>
						<label for="fechaCompletada">Fecha en la que la completaste</label>
						<input type="date" id="fechaCompletada" style="max-width:220px">
					</div>
				</div>
				
				<div class="grupo" id="progreso" hidden>
					<span class="etiqueta">Mi progreso</span>

					<div id="progreso-libro" hidden>
						<label for="paginas">Páginas leídas</label>
						<input type="number" id="paginas" min="0">
					</div>

					<div id="progreso-serie" hidden>
						<label for="temporada">Temporada actual</label>
						<input type="number" id="temporada" min="1">
						<label for="capitulo" style="margin-top:8px">Capítulo actual</label>
						<input type="number" id="capitulo" min="1">
					</div>

					<button type="button" class="btn" id="guardarProgreso" style="margin-top:8px">Guardar progreso</button>
					<p id="msgProgreso" class="msg" role="status"></p>
				</div>

				<div class="grupo">
					<span class="etiqueta">Mi valoración</span>
					<div id="estrellas"></div>
				</div>

				<div class="grupo">
					<label for="resena">Reseña</label>
					<textarea id="resena" placeholder="Escribe tu opinión sobre la obra…"></textarea>
					<small id="contador">0 / 200 palabras</small>
				</div>

				<button type="button" class="btn" id="guardar">Guardar valoración y reseña</button>
				<p id="msg" class="msg" role="status"></p>
			</section>
		</article>`;
}

// Conecta los controles de "Mi experiencia".
function prepararExperiencia() {
	estrellas = Shelfie.estrellas($("estrellas"), {});

	$("estado").addEventListener("change", guardarEstado);
	$("guardar").addEventListener("click", guardarValoracionYResena);
	$("resena").addEventListener("input", contarPalabras);
	if (tipoObra === "LIBRO") { $("progreso").hidden = false; $("progreso-libro").hidden = false; }
	if (tipoObra === "SERIE") { $("progreso").hidden = false; $("progreso-serie").hidden = false; }
	$("guardarProgreso").addEventListener("click", guardarProgreso);
	$("fechaCompletada").max = hoyISO();                          // no se pueden elegir fechas futuras
	$("fechaCompletada").addEventListener("change", guardarEstado); // cambiar la fecha la guarda
}

function contarPalabras() {
	const texto = $("resena").value.trim();
	const palabras = texto === "" ? 0 : texto.split(/\s+/).length;
	$("contador").textContent = palabras + " / 200 palabras";
	$("contador").style.color = palabras > 200 ? "var(--error)" : "inherit";
	return palabras;
}

// ======================================================
// 3) Cargar y guardar mi estado, valoración y reseña
// ======================================================
async function cargarInteracciones() {
	const [est, val, res] = await Promise.all([
		Shelfie.api(`/users/${usuarioId}/works/${obraId}/estado`),
		Shelfie.api(`/api/valoraciones/obra/${obraId}/usuario/${usuarioId}`),
		Shelfie.api(`/api/resenas/obra/${obraId}/usuario/${usuarioId}`)
	]);

	if (est.ok && est.datos) { $("estado").value = est.datos; }
		actualizarGrupoFecha();

	if (val.ok && val.datos) {
		valoracionId = val.datos.id;
		estrellas.set(val.datos.puntuacion);
	}

	if (res.ok && res.datos) {
		resenaId = res.datos.id;
		$("resena").value = res.datos.texto;
		contarPalabras();
	}
}

async function guardarEstado() {
	const estado = $("estado").value;
	if (!estado) { return; }

	actualizarGrupoFecha();

	let url = `/users/${usuarioId}/works/${obraId}/estado?estado=${encodeURIComponent(estado)}`;
	if (estado === "COMPLETADA" && $("fechaCompletada").value) {
		url += "&fecha=" + encodeURIComponent($("fechaCompletada").value);
	}

	const r = await Shelfie.api(url, { method: "PUT" });

	r.ok ? mostrar("Estado actualizado.", true)
		: mostrar(textoError(r, "No se ha podido cambiar el estado."), false);
}

// Fecha de hoy en formato yyyy-MM-dd, en hora local (toISOString usaría UTC).
function hoyISO() {
	const d = new Date();
	return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// Muestra el selector de fecha solo cuando el estado es "Completada".
function actualizarGrupoFecha() {
	const completada = $("estado").value === "COMPLETADA";
	$("grupoFecha").hidden = !completada;
	if (completada && !$("fechaCompletada").value) { $("fechaCompletada").value = hoyISO(); }
}

async function guardarValoracionYResena() {
	const puntuacion = estrellas.get();
	const texto = $("resena").value.trim();

	if (contarPalabras() > 200) {
		mostrar("La reseña no puede superar las 200 palabras.", false);
		return;
	}

	$("guardar").disabled = true;

	try {
		// Valoración: POST si es nueva, PUT si ya existía (así no se duplica).
		if (puntuacion > 0 || valoracionId !== null) {
			const r = valoracionId === null
				? await Shelfie.api("/api/valoraciones", {
					method: "POST", headers: JSON_HEADERS,
					body: JSON.stringify({ usuarioId, obraId, puntuacion })
				})
				: await Shelfie.api("/api/valoraciones/" + valoracionId, {
					method: "PUT", headers: JSON_HEADERS,
					body: JSON.stringify({ puntuacion })
				});

			if (!r.ok) { throw new Error(textoError(r, "No se han podido guardar las estrellas.")); }
			valoracionId = r.datos.id;
		}

		// Reseña: igual, POST si es nueva y PUT si ya existía.
		if (texto) {
			const r = resenaId === null
				? await Shelfie.api("/api/resenas", {
					method: "POST", headers: JSON_HEADERS,
					body: JSON.stringify({ usuarioId, obraId, valoracionId, texto })
				})
				: await Shelfie.api("/api/resenas/" + resenaId, {
					method: "PUT", headers: JSON_HEADERS,
					body: JSON.stringify({ texto })
				});

			if (!r.ok) { throw new Error(textoError(r, "Las estrellas se guardaron, pero la reseña no.")); }
			resenaId = r.datos.id;
		}

		mostrar("Guardado correctamente.", true);
	} catch (error) {
		mostrar(error.message, false);
	} finally {
		$("guardar").disabled = false;
	}
}

async function cargarProgreso() {
	const r = await Shelfie.api("/api/progreso/obra/" + obraId);
	if (!r.ok || !r.datos) { return; }

	if (tipoObra === "LIBRO" || tipoObra === "SERIE") {
		if (r.datos.paginasLeidas != null) { $("paginas").value = r.datos.paginasLeidas; }
		if (r.datos.temporadaActual != null) { $("temporada").value = r.datos.temporadaActual; }
		if (r.datos.capituloActual != null) { $("capitulo").value = r.datos.capituloActual; }
	}
	if (r.datos.fechaCompletada) { $("fechaCompletada").value = r.datos.fechaCompletada; }
	actualizarGrupoFecha();
}

async function guardarProgreso() {
	const num = id => $(id).value === "" ? null : Number($(id).value);
	const cuerpo = tipoObra === "LIBRO"
		? { paginasLeidas: num("paginas") }
		: { temporadaActual: num("temporada"), capituloActual: num("capitulo") };

	const r = await Shelfie.api("/api/progreso/obra/" + obraId,
		{ method: "PUT", headers: JSON_HEADERS, body: JSON.stringify(cuerpo) });

	if (r.ok) {
				if (r.datos.estado) { $("estado").value = r.datos.estado; actualizarGrupoFecha(); }
		mostrar("Progreso guardado.", true, "msgProgreso");
	} else {
		mostrar(textoError(r, "No se ha podido guardar el progreso."), false, "msgProgreso");
	}
}

// ======================================================
// 4) Favoritos y listas
// ======================================================
async function pintarAcciones() {
	const [fav, listas] = await Promise.all([
		Shelfie.api("/api/favoritos"),
		Shelfie.api("/api/listas/obra/" + obraId)
	]);

	const caja = $("acciones");
	caja.hidden = false;
	caja.innerHTML = "";

	const mensaje = crear("p", "", "msg");
	mensaje.setAttribute("role", "status");

	function aviso(texto, correcto) {
		mensaje.textContent = texto;
		mensaje.className = "msg " + (correcto ? "ok" : "error");
	}

	// ----- Favorito: corazón junto al título -----
	let esFavorita = Array.isArray(fav.datos) && fav.datos.some(f => f.obraId === obraId);

	const botonFav = document.createElement("button");
	botonFav.type = "button";
	botonFav.className = "btn-icono";
	botonFav.innerHTML =
		'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
		'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

	// Cambia color/relleno y el texto accesible según el estado.
	function pintarFav() {
		botonFav.classList.toggle("activo", esFavorita);
		botonFav.setAttribute("aria-pressed", String(esFavorita));
		const texto = esFavorita ? "Quitar de favoritos" : "Fijar como favorita";
		botonFav.title = texto;
		botonFav.setAttribute("aria-label", texto);
	}
	pintarFav();

	botonFav.addEventListener("click", async () => {
		const r = await Shelfie.api("/api/favoritos/" + obraId, { method: esFavorita ? "DELETE" : "POST" });
		if (r.ok) {
			esFavorita = !esFavorita;
			pintarFav();
			aviso(esFavorita ? "Obra fijada como favorita." : "Obra quitada de favoritos.", true);
		} else {
			aviso(textoError(r, "No se ha podido completar la acción."), false);
		}
	});
	$("zona-fav").appendChild(botonFav);

	// ----- Listas: botón "+" que pasa a "✓" verde -----
	caja.appendChild(crear("h3", "Guardar en mis listas"));

	if (!listas.ok || !Array.isArray(listas.datos) || listas.datos.length === 0) {
		const vacio = crear("p", "Todavía no tienes listas. ", "vacio");
		const enlace = crear("a", "Créalas en tu perfil");
		enlace.href = "/perfil.html";
		vacio.appendChild(enlace);
		caja.appendChild(vacio);
	} else {
		listas.datos.forEach(lista => {
			let dentro = lista.contieneObra;

			const fila = crear("div", undefined, "lista-fila");
			fila.appendChild(crear("span", lista.nombre));

			const boton = crear("button", "", "btn-mas");
			boton.type = "button";

			function pintarBoton() {
				boton.textContent = dentro ? "✓" : "+";
				boton.classList.toggle("activo", dentro);
				boton.setAttribute("aria-pressed", String(dentro));
				boton.setAttribute("aria-label", (dentro ? "Quitar de " : "Añadir a ") + lista.nombre);
			}
			pintarBoton();

			// Cada clic se guarda al momento (sin botón Guardar).
			boton.addEventListener("click", async () => {
				boton.disabled = true;
				const r = await Shelfie.api("/api/listas/" + lista.id + "/obras/" + obraId,
					{ method: dentro ? "DELETE" : "POST" });
				boton.disabled = false;

				if (r.ok) {
					dentro = !dentro;
					pintarBoton();
					aviso(dentro ? `Añadida a "${lista.nombre}".` : `Quitada de "${lista.nombre}".`, true);
				} else {
					aviso(textoError(r, "No se ha podido guardar el cambio."), false);
				}
			});

			fila.appendChild(boton);
			caja.appendChild(fila);
		});
	}

	caja.appendChild(mensaje);
}


iniciar();
</script>

</body>
</html>
