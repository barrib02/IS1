<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ficha de obra</title>

<style>

body{
    font-family: Arial;
    max-width:900px;
    margin:auto;
    padding:30px;
}

.tarjeta{

    border:1px solid #ddd;
    border-radius:10px;

    padding:20px;

    box-shadow:0 0 10px rgba(0,0,0,0.1);

}

</style>

</head>

<body>

<div id="contenido"></div>

<script>

const id =
window.location.search
    .replace("?id=","");

async function cargarObra(){

    const respuesta =
        await fetch("/work/" + id);

    const obra =
        await respuesta.json();

    document.getElementById("contenido")
        .innerHTML =

`
<div class="tarjeta">

<h1>${obra.titulo}</h1>

<p><b>Autor:</b> ${obra.autor}</p>

<p><b>Tipo:</b> ${obra.tipo}</p>

<p>${obra.descripcion}</p>

</div>
`;

}

cargarObra();

</script>

</body>
</html>
