<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi perfil - Shelfie</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>
<script src="/js/estados.js"></script>

<!-- Solo lo específico del perfil. Lo común (fondo, tarjetas, barra...) viene de shelfie.css.
     IMPORTANTE: aquí ya NO hay "body { padding: 20px }", que era lo que daba margen a la barra. -->
<style>
/* Los botones de esta página se estilan solo dentro de <main>
   para no afectar a los de la barra superior. */
main button {
	padding: 8px 12px;
	border: none;
	border-radius: 5px;
	background-color: var(--verde);
	color: white;
	cursor: pointer;
	font: inherit;
	font-size: 0.95rem;
}

main button:hover {
	background-color: var(--verde-oscuro);
}

main button.secundario {
	background-color: #8a7a6b;
}

main button.secundario:hover {
	background-color: #6e6054;
}

main button.peligro {
	background-color: var(--error);
}

main button.peligro:hover {
	background-color: #962d22;
}

main button:disabled {
	opacity: 0.4;
	cursor: default;
}

main h1, main h2, main h3 {
	margin-top: 0;
}

main textarea {
	height: 110px;
	resize: vertical;
}

/* Fila superior con los botones "Subir obra" y "Cerrar sesión" */
.cabecera {
	display: flex;
	justify-content: flex-end;
	flex-wrap: wrap;
	gap: 8px;
	margin-bottom: 15px;
}

main button.icono {
	display: inline-flex;
	align-items: center;
	padding: 8px 10px;
}

#diario>summary {
	font-family: var(--fuente-titulos);
	font-size: 1.5rem;
}

#diario[open]>summary {
	margin-bottom: 12px;
}

.contador {
	text-align: right;
	font-size: 14px;
	margin: 5px 0 10px;
}

.contador.excedido {
	color: var(--error);
}

.bloque {
	margin-bottom: 25px;
}

/* Tarjetas de favoritos, listas y actividad */
.fav, .lista {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 8px;
	padding: 10px;
	margin-bottom: 8px;
	border: 1px solid var(--borde);
	border-left: 5px solid var(--verde);
	border-radius: 6px;
	background: #fbfaf7;
}

.fav .posicion {
	font-weight: bold;
	font-size: 18px;
	min-width: 24px;
}

.fav .titulo, .lista .titulo {
	flex: 1;
	min-width: 150px;
	font-weight: bold;
}

.fav a, .lista a {
	text-decoration: none;
}

.fav a:hover, .lista a:hover {
	text-decoration: underline;
}

.sustituir-caja {
	flex-basis: 100%;
	display: flex;
	gap: 8px;
}

.anadir-fila {
	display: flex;
	gap: 8px;
	margin-top: 10px;
}

/* Etiqueta "Pública / Privada". Se redefine porque shelfie.css
   usa ".etiqueta" para los títulos de los formularios. */
.etiqueta {
	display: inline-block;
	font-weight: normal;
	margin: 0;
	font-size: 12px;
	padding: 2px 8px;
	border-radius: 10px;
	background: var(--borde);
}

.etiqueta.publica {
	background: #cfe9d9;
}

/* Formulario para crear una lista */
.form-lista {
	display: flex;
	flex-wrap: wrap;
	gap: 10px;
	align-items: center;
	margin-bottom: 15px;
}

.form-lista input[type="text"] {
	flex: 1;
	min-width: 180px;
	width: auto;
}
/* El checkbox "Pública" no debe ocupar todo el ancho */
.form-lista label {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	font-weight: normal;
	margin: 0;
}

.form-lista input[type="checkbox"] {
	width: auto;
	padding: 0;
}

#mensaje {
	min-height: 22px;
	font-weight: bold;
}

#mensaje.ok {
	color: var(--ok);
}

#mensaje.error {
	color: var(--error);
}

/* Cabecera del perfil: banner + foto superpuesta */
/* Cabecera del perfil: banner, foto superpuesta, nombre y biografía debajo */
#bannerPerfil {
	display: block;
	width: 100%;
	height: 240px;
	object-fit: cover;
	border-radius: 10px;
	background-color: var(--borde);
}

.fila-perfil {
	display: flex;
	align-items: flex-end;
	/* el nombre queda a la altura del borde inferior de la foto */
	gap: 20px;
	padding: 0 25px;
	margin-top: -65px; /* la foto sube sobre el banner */
}

#fotoPerfil {
	position: relative; /* para que pinte por encima del banner */
	flex: 0 0 auto;
	width: 130px;
	height: 130px;
	object-fit: cover;
	border-radius: 50%;
	border: 5px solid white;
	background-color: var(--borde);
}

#nombreUsuario {
	margin: 0 0 12px;
	font-size: 30px;
}

.biografia {
	margin: 16px 0 0;
	padding: 0 25px;
	white-space: pre-wrap; /* respeta los saltos de línea */
	overflow-wrap: anywhere;
}

.editar-imagenes {
	display: flex;
	flex-wrap: wrap;
	gap: 25px;
	margin-bottom: 25px;
}

.editar-imagenes>div {
	flex: 1;
	min-width: 250px;
}

/* Ocultar el texto "Ningún archivo seleccionado" */
.editar-imagenes input[type="file"] {
	width: 170px;
	max-width: 100%;
	overflow: hidden;
	white-space: nowrap;
	color: transparent;
}

.editar-imagenes input[type="file"]::file-selector-button {
	color: var(--tinta);
	cursor: pointer;
}

/* Calendario de obras completadas */
.cab-calendario {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 8px;
	margin-bottom: 12px;
}

.cab-calendario h2 {
	margin: 0;
	text-transform: capitalize;
}

.calendario {
	display: grid;
	grid-template-columns: repeat(7, minmax(0, 1fr));
	gap: 4px;
}

.cal-semana {
	text-align: center;
	font-weight: bold;
	font-size: 0.8rem;
	color: var(--tinta-suave);
}

.cal-dia {
	min-height: 84px;
	padding: 4px;
	overflow: hidden;
	border: 1px solid var(--borde);
	border-radius: 6px;
	background: #fbfaf7;
	font-size: 0.8rem;
}

.cal-dia.fuera {
	background: transparent;
	border-color: transparent;
}

.cal-dia.hoy {
	border-color: var(--ambar);
	border-width: 2px;
}

.cal-dia .num {
	color: var(--tinta-suave);
}

.cal-dia a {
	display: block;
	margin-top: 3px;
	padding: 1px 5px;
	border-radius: 6px;
	font-size: 0.75rem;
	text-decoration: none;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.cal-dia a.tipo-libro {
	background: var(--f-libro);
	color: var(--c-libro);
}

.cal-dia a.tipo-pelicula {
	background: var(--f-pelicula);
	color: var(--c-pelicula);
}

.cal-dia a.tipo-serie {
	background: var(--f-serie);
	color: var(--c-serie);
}

.cal-dia a.tipo-videojuego {
	background: var(--f-videojuego);
	color: var(--c-videojuego);
}

/* Móvil: banner y foto más pequeños para que no se salgan */
@media ( max-width : 600px) {
	#bannerPerfil {
		height: 160px;
	}
	.fila-perfil {
		gap: 12px;
		padding: 0 12px;
		margin-top: -45px;
	}
	#fotoPerfil {
		width: 90px;
		height: 90px;
	}
	#nombreUsuario {
		font-size: 22px;
		margin-bottom: 8px;
	}
	.biografia {
		padding: 0 12px;
	}
	.cal-dia {
		min-height: 56px;
	}
	.cal-dia a {
		font-size: 0.65rem;
		padding: 0 3px;
	}
}
</style>
</head>

<body>

	<!-- La barra superior va PRIMERA y fuera de cualquier contenedor:
	     así ocupa todo el ancho, como en el resto de páginas. -->
	<div id="navbar"></div>

	<main class="contenedor">

		<div class="cabecera">
			<button type="button" class="icono" aria-label="Configuración"
				title="Configuración"
				onclick="window.location.href='configuracion.html'">
				<svg viewBox="0 0 24 24" width="20" height="20" fill="none"
					stroke="currentColor" stroke-width="2" stroke-linecap="round"
					stroke-linejoin="round" aria-hidden="true">
					<circle cx="12" cy="12" r="3" />
					<path
						d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />

		<section class="tarjeta">

		<section class="tarjeta">

	<script>
    // ---------- Utilidades ----------

    const TIPOS = [
        { valor: "LIBRO",      nombre: "Libros" },
        { valor: "PELICULA",   nombre: "Películas" },
        { valor: "SERIE",      nombre: "Series" },
        { valor: "VIDEOJUEGO", nombre: "Videojuegos" }
    ];

    let favoritos = [];
    let todasObras = [];
    let usuarioActualId = null;
    let estadosFavoritos = new Map();

    // Llama a la API. Si no hay sesión, redirige al login.
    // Si el servidor devuelve un error, lanza una excepción con su mensaje.
    async function api(url, opciones) {
        const respuesta = await fetch(
            url,
            Object.assign({ credentials: "same-origin" }, opciones));

        if (respuesta.status === 401 || respuesta.status === 403) {
            window.location.href = "login.html";
            throw new Error("Debes iniciar sesión.");
        }

        const texto = await respuesta.text();
        let datos = null;

        if (texto) {
            try {
                datos = JSON.parse(texto);
            } catch (e) {
                datos = texto;
            }
        }

        if (!respuesta.ok) {
            throw new Error(typeof datos === "string"
                ? datos
                : "Error " + respuesta.status);
        }

        return datos;
    }

    function jsonPost(cuerpo, metodo) {
        return {
            method: metodo,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(cuerpo)
        };
    }

    // Muestra un mensaje de éxito o error arriba de la página.
    function mostrar(texto, correcto) {
        const mensaje = document.getElementById("mensaje");
        mensaje.textContent = texto;
        mensaje.className = correcto ? "ok" : "error";
    }

    // Ejecuta una acción y muestra el error si falla.
    async function accion(funcion, textoOk) {
        try {
            await funcion();
            if (textoOk) {
                mostrar(textoOk, true);
            }
        } catch (error) {
            mostrar(error.message, false);
        }
    }

    // Crea un elemento HTML con texto seguro (sin interpretar HTML).
    function crear(etiqueta, texto, clase) {
        const el = document.createElement(etiqueta);
        if (texto !== undefined) {
            el.textContent = texto;
        }
        if (clase) {
            el.className = clase;
        }
        return el;
    }

    function boton(texto, clase, alPulsar) {
        const b = crear("button", texto, clase);
        b.type = "button";
        b.addEventListener("click", alPulsar);
        return b;
    }

	// ---------- Perfil ----------

	async function cargarPerfil() {
	    const perfil = await api("/api/perfil");
	    usuarioActualId = perfil.id;
	    document.getElementById("nombreUsuario").textContent = perfil.nombre;
	    document.getElementById("biografiaTexto").textContent =
	        perfil.biografia || "Todavía no has escrito una biografía.";

	    const foto = document.getElementById("fotoPerfil");
	    if (perfil.fotoPerfilUrl) {
	        foto.src = perfil.fotoPerfilUrl;
	        foto.style.display = "block";
	    }

	    const banner = document.getElementById("bannerPerfil");
	    if (perfil.bannerUrl) {
	        banner.src = perfil.bannerUrl;
	        banner.style.display = "block";
	    }
	}
	
	async function cargarSeguimientos() {

	    const seguidores =
	        await api(
	            "/api/usuarios/"
	            + usuarioActualId
	            + "/seguidores");

	    const seguidos =
	        await api(
	            "/api/usuarios/"
	            + usuarioActualId
	            + "/seguidos");

	    document.getElementById(
	        "numeroSeguidores"
	    ).textContent = seguidores.length;

	    document.getElementById(
	        "numeroSeguidos"
	    ).textContent = seguidos.length;

	    document.getElementById(
	        "enlaceSeguidores"
	    ).href =
	        "/seguimientos.html?tipo=seguidores";

	    document.getElementById(
	        "enlaceSeguidos"
	    ).href =
	        "/seguimientos.html?tipo=seguidos";
	}
	
	// ---------- Actividad reciente (H4.5) ----------

	async function cargarActividad() {

	    const contenedor =
	        document.getElementById("actividadReciente");

	    contenedor.innerHTML = "";

	    try {

	        const actividades = await api("/api/actividad");

	        if (!Array.isArray(actividades)) {
	            throw new Error("Respuesta incorrecta");
	        }

	        if (actividades.length === 0) {

	            contenedor.appendChild(crear(
	                "p",
	                "Todavía no tienes actividades recientes.",
	                "vacio"
	            ));

	            return;
	        }

	        const nombresActividad = {
	            ESTADO: "Cambio de estado",
	            VALORACION: "Valoración",
	            RESENA: "Reseña",
	            FAVORITO: "Favorito",
	            PROGRESO: "Progreso",
	            LISTA: "Lista"
	        };

	        actividades.forEach(actividad => {

	            const fila = crear("div", undefined, "lista");
	            const contenido = crear("div");

	            contenido.style.flex = "1";

	            // Tipo de acción.
	            contenido.appendChild(crear(
	                "span",
	                nombresActividad[actividad.tipo]
	                    || actividad.tipo
	                    || "Actividad",
	                "chip"
	            ));

	            // Información de la obra.
	            if (actividad.tituloObra) {

	                const titulo = crear("p");

	                const enlace = crear(
	                    "a",
	                    actividad.tituloObra
	                );

	                enlace.href = "/work.html?id=" +
	                    encodeURIComponent(actividad.obraId);

	                enlace.style.fontWeight = "bold";

	                titulo.appendChild(enlace);

	                contenido.appendChild(titulo);

	                if (actividad.tipoObra) {

	                    contenido.appendChild(crear(
	                        "span",
	                        Shelfie.NOMBRE_TIPO[actividad.tipoObra]
	                            || actividad.tipoObra,
	                        "chip"
	                    ));
	                }

	            } else if (actividad.obraId != null) {

	                contenido.appendChild(crear(
	                    "p",
	                    "Obra no disponible",
	                    "vacio"
	                ));
	            }

	            // Descripción de la acción.
	            contenido.appendChild(crear(
	                "p",
	                actividad.descripcion || ""
	            ));

	            // Fecha y hora.
	            const fecha = new Date(actividad.fecha);

	            contenido.appendChild(crear(
	                "small",
	                actividad.fecha && !isNaN(fecha.getTime())
	                    ? fecha.toLocaleString("es-ES")
	                    : "Fecha no disponible"
	            ));

	            fila.appendChild(contenido);
	            contenedor.appendChild(fila);
	        });

	    } catch (error) {

	        contenedor.innerHTML = "";

	        contenedor.appendChild(crear(
	            "p",
	            "No se ha podido cargar el historial de actividad.",
	            "vacio"
	        ));
	    }
	}
	
	// ---------- Progreso -----------
	async function cargarProgreso() {
		const r = await Shelfie.api("/api/progreso/en-curso");
		if (!r.ok || !Array.isArray(r.datos) || r.datos.length === 0) { return; }

		document.getElementById("tarjetaProgreso").hidden = false;
		document.getElementById("listaProgreso").innerHTML = r.datos.map(p => {
			const detalle = p.tipo === "LIBRO"
				? p.paginasLeidas + " páginas leídas"
				: "Temporada " + p.temporadaActual + " · Capítulo " + p.capituloActual;
			return `<div class="lista-fila">
				<span>${Shelfie.chipTipo(p.tipo)} <a href="/work.html?id=${p.obraId}">${Shelfie.esc(p.titulo)}</a></span>
				<span class="chip">
			    ${Shelfie.esc(EstadosShelfie.texto(p.tipo, "EN_CURSO"))}
			</span>
			<span>${Shelfie.esc(detalle)}</span>
			</div>`;
		}).join("");
	}
	
	// ---------- Calendario de obras completadas ----------

	let calAnio = new Date().getFullYear();
	let calMes = new Date().getMonth() + 1;   // 1-12

	async function cargarCalendario() {
	    const obras = await api("/api/estadisticas/calendario?anio=" + calAnio + "&mes=" + calMes);

	    document.getElementById("tituloMes").textContent =
	        new Date(calAnio, calMes - 1, 1)
	            .toLocaleDateString("es-ES", { month: "long", year: "numeric" });

	    // Agrupamos por día del mes: { 20: [obra, obra], ... }
	    const porDia = {};
	    obras.forEach(o => {
	        const dia = Number(o.fecha.substring(8, 10));
	        (porDia[dia] = porDia[dia] || []).push(o);
	    });

	    const cont = document.getElementById("calendario");
	    cont.innerHTML = "";

	    ["L", "M", "X", "J", "V", "S", "D"].forEach(d =>
	        cont.appendChild(crear("div", d, "cal-semana")));

	    // getDay() devuelve 0 para domingo; queremos que la semana empiece en lunes.
	    const huecos = (new Date(calAnio, calMes - 1, 1).getDay() + 6) % 7;
	    const diasMes = new Date(calAnio, calMes, 0).getDate();

	    for (let i = 0; i < huecos; i++) {
	        cont.appendChild(crear("div", undefined, "cal-dia fuera"));
	    }

	    const hoy = new Date();

	    for (let d = 1; d <= diasMes; d++) {
	        const celda = crear("div", undefined, "cal-dia");

	        if (hoy.getFullYear() === calAnio && hoy.getMonth() + 1 === calMes && hoy.getDate() === d) {
	            celda.classList.add("hoy");
	        }

	        celda.appendChild(crear("div", d, "num"));

	        (porDia[d] || []).forEach(o => {
	            const enlace = crear("a", o.titulo);
	            enlace.href = "/work.html?id=" + encodeURIComponent(o.obraId);
	            enlace.title = o.titulo;
	            celda.appendChild(enlace);
	        });

	        cont.appendChild(celda);
	    }
	}

	function cambiarMes(delta) {
	    calMes += delta;
	    if (calMes < 1)  { calMes = 12; calAnio--; }
	    if (calMes > 12) { calMes = 1;  calAnio++; }
	    accion(cargarCalendario);
	}

	document.getElementById("mesAnterior").addEventListener("click", () => cambiarMes(-1));
	document.getElementById("mesSiguiente").addEventListener("click", () => cambiarMes(1));
	
	// El calendario se carga la primera vez que se despliega el Diario.
	let diarioCargado = false;
	document.getElementById("diario").addEventListener("toggle", function () {
	    if (this.open && !diarioCargado) {
	        diarioCargado = true;
	        accion(cargarCalendario);
	    }
	});

    // ---------- Favoritos ----------

    async function cargarFavoritos() {

    favoritos = await api("/api/favoritos");

    estadosFavoritos = await EstadosShelfie.obtenerVarios(
        usuarioActualId,
        favoritos.map(fav => fav.obraId)
    );

    pintarFavoritos();
}

    // Obras de un tipo que todavía no son favoritas.
    function obrasDisponibles(tipo) {
        const idsFavoritos = favoritos.map(f => f.obraId);

        return todasObras.filter(o =>
            o.tipo === tipo && !idsFavoritos.includes(o.id));
    }

    function crearSelector(tipo) {
        const select = document.createElement("select");
        const disponibles = obrasDisponibles(tipo);

        if (disponibles.length === 0) {
            const vacia = crear("option", "No hay más obras de este tipo");
            vacia.value = "";
            select.appendChild(vacia);
            select.disabled = true;
            return select;
        }

        disponibles.forEach(obra => {
            const opcion = crear("option", obra.titulo);
            opcion.value = obra.id;
            select.appendChild(opcion);
        });

        return select;
    }

    function pintarFavoritos() {
        const contenedor = document.getElementById("favoritos");
        contenedor.innerHTML = "";

        TIPOS.forEach(tipo => {
            const items = favoritos
                .filter(f => f.tipo === tipo.valor)
                .sort((a, b) => a.posicion - b.posicion);

            const bloque = crear("div", undefined, "bloque");
            bloque.appendChild(
                crear("h3", tipo.nombre + " (" + items.length + "/5)"));

            if (items.length === 0) {
                bloque.appendChild(crear("p",
                    "Todavía no tienes favoritos en esta categoría.",
                    "vacio"));
            }

            items.forEach((fav, indice) => {
                bloque.appendChild(
                    crearTarjetaFavorito(tipo.valor, items, fav, indice));
            });

            if (items.length < 5) {
                bloque.appendChild(crearFilaAnadir(tipo.valor));
            }

            contenedor.appendChild(bloque);
        });
    }

    function crearTarjetaFavorito(tipo, items, fav, indice) {
        const tarjeta = crear("div", undefined, "fav");

        tarjeta.appendChild(crear("span", fav.posicion, "posicion"));

        const titulo = crear("span", undefined, "titulo");
        const enlace = crear("a", fav.titulo);

        if (
            fav.fuenteApi === "TMDB" &&
            fav.idExterno != null &&
            ["PELICULA", "SERIE"].includes(fav.tipo)
        ) {
            enlace.href = "/work.html?fuente=TMDB"
                + "&tipo=" + encodeURIComponent(fav.tipo)
                + "&idExterno=" + encodeURIComponent(fav.idExterno);
        } else {
            enlace.href = "/work.html?id=" + encodeURIComponent(fav.obraId);
        }
        titulo.appendChild(enlace);
        tarjeta.appendChild(titulo);
        const estado = estadosFavoritos.get(String(fav.obraId));

        if (estado === "NO_DISPONIBLE") {

            tarjeta.appendChild(
                crear("span", "Estado no disponible", "chip")
            );

        } else {

            tarjeta.appendChild(
                EstadosShelfie.crearEtiqueta(fav.tipo, estado)
            );
        }

        const subir = boton("↑", "secundario", () =>
            mover(tipo, items, indice, -1));
        subir.disabled = indice === 0;
        subir.title = "Subir";

        const bajar = boton("↓", "secundario", () =>
            mover(tipo, items, indice, 1));
        bajar.disabled = indice === items.length - 1;
        bajar.title = "Bajar";

        tarjeta.appendChild(subir);
        tarjeta.appendChild(bajar);

        // Caja de sustitución (oculta hasta pulsar "Sustituir").
        const caja = crear("div", undefined, "sustituir-caja");
        caja.style.display = "none";

        const selector = crearSelector(tipo);
        caja.appendChild(selector);
        caja.appendChild(boton("Confirmar", "", () => {
            if (!selector.value) {
                return;
            }
            sustituir(fav.obraId, selector.value);
        }));

        tarjeta.appendChild(boton("Sustituir", "secundario", () => {
            caja.style.display =
                caja.style.display === "none" ? "flex" : "none";
        }));

        tarjeta.appendChild(boton("Quitar", "peligro", () =>
            quitarFavorito(fav.obraId)));

        tarjeta.appendChild(caja);

        return tarjeta;
    }

    function crearFilaAnadir(tipo) {
        const fila = crear("div", undefined, "anadir-fila");
        const selector = crearSelector(tipo);

        fila.appendChild(selector);
        fila.appendChild(boton("Fijar como favorita", "", () => {
            if (!selector.value) {
                return;
            }
            anadirFavorito(selector.value);
        }));

        return fila;
    }

    function anadirFavorito(obraId) {
        accion(async function () {
            await api("/api/favoritos/" + obraId, { method: "POST" });
            await cargarFavoritos();
        }, "Favorito añadido.");
    }

    function quitarFavorito(obraId) {
        if (!confirm("¿Quitar esta obra de tus favoritos?")) {
            return;
        }

        accion(async function () {
            await api("/api/favoritos/" + obraId, { method: "DELETE" });
            await cargarFavoritos();
        }, "Favorito eliminado.");
    }

    function sustituir(obraAntiguaId, obraNuevaId) {
        accion(async function () {
            await api("/api/favoritos/" + obraAntiguaId
                + "/sustituir/" + obraNuevaId, { method: "PUT" });
            await cargarFavoritos();
        }, "Favorito sustituido.");
    }

    // Intercambia la posición de dos favoritos contiguos.
    function mover(tipo, items, indice, desplazamiento) {
        const destino = indice + desplazamiento;

        if (destino < 0 || destino >= items.length) {
            return;
        }

        const ids = items.map(f => f.obraId);
        const temporal = ids[indice];
        ids[indice] = ids[destino];
        ids[destino] = temporal;

        accion(async function () {
            await api("/api/favoritos/orden?tipo=" + tipo,
                jsonPost(ids, "PUT"));
            await cargarFavoritos();
        });
    }

    // ---------- Listas ----------

    async function cargarListas() {
        const listas = await api("/api/listas");
        pintarListas(listas);
    }

    function pintarListas(listas) {
        const contenedor = document.getElementById("listas");
        contenedor.innerHTML = "";

        if (listas.length === 0) {
            contenedor.appendChild(crear("p",
                "Todavía no has creado ninguna lista.", "vacio"));
            return;
        }

        listas.forEach(lista => {
            const fila = crear("div", undefined, "lista");

            const titulo = crear("span", undefined, "titulo");
            const enlace = crear("a",
                lista.nombre + " (" + lista.numeroObras
                + (lista.numeroObras === 1 ? " obra)" : " obras)"));
            enlace.href = "lista.html?id=" + lista.id;
            titulo.appendChild(enlace);
            fila.appendChild(titulo);

            fila.appendChild(crear("span",
                lista.publica ? "Pública" : "Privada",
                lista.publica ? "etiqueta publica" : "etiqueta"));

            fila.appendChild(boton("Editar", "secundario", () =>
                renombrarLista(lista)));

            fila.appendChild(boton(
                lista.publica ? "Hacer privada" : "Hacer pública",
                "secundario",
                () => cambiarVisibilidad(lista)));

            fila.appendChild(boton("Borrar", "peligro", () =>
                borrarLista(lista)));

            if (lista.descripcion) {
                fila.appendChild(crear("span", lista.descripcion));
            }

            contenedor.appendChild(fila);
        });
    }

    document.getElementById("formLista")
        .addEventListener("submit", function (evento) {

        evento.preventDefault();

        const nombre = document.getElementById("nombreLista");
        const publica = document.getElementById("publicaLista");
        const descripcion = document.getElementById("descripcionLista");

        accion(async function () {
            await api("/api/listas", jsonPost({
                nombre: nombre.value,
                descripcion: descripcion.value,
                publica: publica.checked
            }, "POST"));

            nombre.value = "";
            descripcion.value = "";
            publica.checked = false;
            await cargarListas();
        }, "Lista creada.");
    });

    function renombrarLista(lista) {

        const nuevoNombre = prompt("Nuevo nombre:", lista.nombre);

        if (nuevoNombre === null) {
            return;
        }

        const nuevaDescripcion =
            prompt("Nueva descripción:", lista.descripcion || "");

        if (nuevaDescripcion === null) {
            return;
        }

        accion(async function () {
            await api("/api/listas/" + lista.id,
                jsonPost({
                    nombre: nuevoNombre,
                    descripcion: nuevaDescripcion,
                    publica: lista.publica
                }, "PUT"));

            await cargarListas();
        }, "Lista actualizada.");
    }

    function cambiarVisibilidad(lista) {
        accion(async function () {
            await api("/api/listas/" + lista.id,
                jsonPost({
                    nombre: lista.nombre,
                    descripcion: lista.descripcion,
                    publica: !lista.publica
                }, "PUT"));
            await cargarListas();
        }, "Visibilidad actualizada.");
    }

    function borrarLista(lista) {
        if (!confirm("¿Borrar la lista \"" + lista.nombre + "\"?")) {
            return;
        }

        accion(async function () {
            await api("/api/listas/" + lista.id, { method: "DELETE" });
            await cargarListas();
        }, "Lista eliminada.");
    }

    // ---------- Cerrar sesión ----------

    document.getElementById("cerrarSesion")
        .addEventListener("click", async function () {

        try {
            await fetch("/api/auth/logout", {
                method: "POST",
                credentials: "same-origin"
            });
        } finally {
            window.location.href = "login.html";
        }
    });

    // ---------- Inicio ----------

    async function iniciar() {
        try {
            await cargarPerfil();
            await cargarSeguimientos();
            await cargarActividad();
            todasObras = await api("/search");
            await cargarFavoritos();
            await cargarListas();
			await cargarProgreso();
        } catch (error) {
            mostrar(error.message, false);
        }
    }

    iniciar();
	</script>
