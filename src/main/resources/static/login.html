<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión - Shelfie</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>
<style>
.formulario {
	max-width: 420px;
	margin: 24px auto;
}

.formulario .btn-enviar {
	width: 100%;
	margin-top: 8px;
}

.centrado {
	text-align: center;
}

.password-container {
	position: relative;
}

.password-container input {
	padding-right: 48px;
}

.password-toggle {
	position: absolute;
	right: 6px;
	top: 50%;
	transform: translateY(-50%);
	width: 40px;
	height: 40px;
	padding: 0;
	background: transparent;
	border: 0;
	cursor: pointer;
	font-size: 20px;
	touch-action: none;
}
</style>
</head>
<body>

	<div id="navbar"></div>

	<main class="contenedor">
		<section class="tarjeta formulario">

			<h1>Iniciar sesión</h1>

			<form id="formLogin">
				<div class="grupo">
					<label for="email">Correo electrónico</label> <input type="email"
						id="email" autocomplete="email" required>
				</div>

				<div class="grupo">
					<label for="password">Contraseña</label>
					<div class="password-container">
						<input type="password" id="password"
							autocomplete="current-password" required>
						<!-- Solo muestra la contraseña mientras se pulsa -->
						<button type="button" id="mostrarPassword" class="password-toggle"
							aria-label="Mantener pulsado para mostrar contraseña"
							aria-pressed="false">👁️</button>
					</div>
				</div>

				<button type="submit" class="btn btn-enviar">Entrar</button>
			</form>

			<p id="mensaje" class="msg centrado" role="status" aria-live="polite"></p>
			<p class="centrado">
				<a href="/recuperar-password.html"> ¿Has olvidado tu contraseña?
				</a>
			</p>
			<p class="centrado">
				¿No tienes cuenta? <a href="/registro.html">Regístrate aquí</a>
			</p>

		</section>
	</main>

	<script>
const mensaje = document.getElementById("mensaje");

document.getElementById("formLogin").addEventListener("submit", async function (event) {
	event.preventDefault();

	const credenciales = {
		email: document.getElementById("email").value,
		password: document.getElementById("password").value
	};

	try {
		const respuesta = await fetch("/api/auth/login", {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			credentials: "same-origin",
			body: JSON.stringify(credenciales)
		});

		const texto = await respuesta.text();
		mensaje.textContent = texto;

		if (respuesta.ok) {
			mensaje.className = "msg centrado ok";
			// La sesión se conserva con la cookie gestionada por Spring Security.
			window.location.href = "/search.html";
		} else {
			mensaje.className = "msg centrado error";
		}
	} catch (error) {
		mensaje.className = "msg centrado error";
		mensaje.textContent = "No se pudo conectar con el servidor.";
	}
});

// ---------- Mostrar la contraseña mientras se mantiene pulsado ----------
const passwordInput = document.getElementById("password");
const botonOjo = document.getElementById("mostrarPassword");

function mostrarPassword() {
	passwordInput.type = "text";
	botonOjo.setAttribute("aria-pressed", "true");
}
function ocultarPassword() {
	passwordInput.type = "password";
	botonOjo.setAttribute("aria-pressed", "false");
}

botonOjo.addEventListener("pointerdown", function (event) {
	event.preventDefault();
	botonOjo.setPointerCapture(event.pointerId);
	mostrarPassword();
});
botonOjo.addEventListener("pointerup", ocultarPassword);
botonOjo.addEventListener("pointercancel", ocultarPassword);
botonOjo.addEventListener("lostpointercapture", ocultarPassword);

botonOjo.addEventListener("keydown", function (event) {
	if (event.key === " " || event.key === "Enter") {
		event.preventDefault();
		mostrarPassword();
	}
});
botonOjo.addEventListener("keyup", ocultarPassword);
botonOjo.addEventListener("blur", ocultarPassword);
</script>
</body>
</html>
