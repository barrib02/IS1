<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de creador - Shelfie</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>
<style>
	.foto { width: 200px; max-width: 100%; border-radius: 10px; margin-bottom: 20px; }
	.obra { padding: 10px; margin: 8px 0; background: #fbfaf7; border-left: 5px solid var(--verde); border-radius: 5px; }
	.obra.destacada { background: #fff6d8; border-left-color: var(--ambar); }
</style>
</head>
<body>

<div id="navbar"></div>

<main class="contenedor">
	<div id="contenido"></div>
</main>

<script>
const creadorId = new URLSearchParams(window.location.search).get("id");

const SECCIONES = [
	{ tipo: "LIBRO", titulo: "Libros" },
	{ tipo: "PELICULA", titulo: "Películas" },
	{ tipo: "SERIE", titulo: "Series" },
	{ tipo: "VIDEOJUEGO", titulo: "Videojuegos" }
];

function filaObra(obra, destacada) {
	return `
		<div class="obra${destacada ? " destacada" : ""}">
			<a href="/work.html?id=${obra.id}">${Shelfie.esc(obra.titulo)}</a>
			${destacada ? "<span class=\"chip\">" + Shelfie.esc(Shelfie.formatearEnum(obra.tipo)) + "</span>" : ""}
		</div>`;
}

async function cargarCreador() {
	const caja = document.getElementById("contenido");

	if (!creadorId) {
		caja.innerHTML = '<div class="tarjeta"><h2>Falta el creador</h2><p>Entra desde la ficha de una obra.</p></div>';
		return;
	}

	const r = await Shelfie.api("/creador/" + creadorId);

	if (!r.ok || !r.datos || typeof r.datos !== "object") {
		caja.innerHTML = '<div class="tarjeta"><h2>Creador no encontrado</h2><p><a href="/search.html">Volver al buscador</a></p></div>';
		return;
	}

	const creador = r.datos;
	const destacadas = creador.destacadas || [];
	const obras = creador.obras || [];

	let html = `<article class="tarjeta">
		<h1>${Shelfie.esc(creador.nombre)}</h1>
		${creador.foto ? `<img class="foto" src="${Shelfie.esc(creador.foto)}" alt="${Shelfie.esc(creador.nombre)}">` : ""}
		<h2>Biografía</h2>
		<p>${Shelfie.esc(creador.biografia || "")}</p>
		<h2>Obras destacadas</h2>
		${destacadas.length ? destacadas.map(o => filaObra(o, true)).join("") : '<p class="vacio">Sin obras destacadas.</p>'}`;

	SECCIONES.forEach(seccion => {
		const lista = obras.filter(o => o.tipo === seccion.tipo);
		html += `<h2>${seccion.titulo}</h2>`;
		html += lista.length ? lista.map(o => filaObra(o, false)).join("") : '<p class="vacio">Nada todavía.</p>';
	});

	html += "</article>";
	caja.innerHTML = html;
}

cargarCreador();
</script>
</body>
</html>
