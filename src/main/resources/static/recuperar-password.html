<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Recuperar contraseña - Shelfie</title>

<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/shelfie.css">
<script src="/js/shelfie.js"></script>

<style>
.formulario {
	max-width: 420px;
	margin: 24px auto;
}

.formulario .btn {
	width: 100%;
	margin-top: 8px;
}

.centrado {
	text-align: center;
}
</style>
</head>

<body>

	<div id="navbar"></div>

	<main class="contenedor">

		<section class="tarjeta formulario">

			<h1>Recuperar contraseña</h1>

			<p>Introduce el correo electrónico de tu cuenta. Te enviaremos un
				enlace para elegir una nueva contraseña.</p>

			<form id="formRecuperacion">

				<div class="grupo">

					<label for="email">Correo electrónico</label> <input type="email"
						id="email" autocomplete="email" maxlength="254" required>

				</div>

				<button type="submit" class="btn" id="enviar">Enviar enlace
					de recuperación</button>

			</form>

			<p id="mensaje" class="msg centrado" role="status"></p>

			<p class="centrado">
				<a href="/login.html">Volver a iniciar sesión</a>
			</p>

		</section>

	</main>

	<script>

const mensaje = document.getElementById("mensaje");
const boton = document.getElementById("enviar");

document.getElementById("formRecuperacion")
    .addEventListener("submit", async event => {

        event.preventDefault();

        boton.disabled = true;

        mensaje.textContent = "Enviando solicitud…";
        mensaje.className = "msg centrado";

        try {

            const respuesta = await fetch(
                "/api/auth/recuperar-password",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: document.getElementById("email")
                            .value.trim()
                    })
                }
            );

            mensaje.textContent = respuesta.ok
                ? await respuesta.text()
                : "No se ha podido procesar la solicitud.";

            mensaje.className = respuesta.ok
                ? "msg centrado ok"
                : "msg centrado error";

        } catch (error) {

            mensaje.textContent =
                "No se ha podido conectar con el servidor.";

            mensaje.className = "msg centrado error";

        } finally {

            boton.disabled = false;
        }
    });

</script>

</body>
</html>
