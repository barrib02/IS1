<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ficha de obra</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 30px;
    background-color: #f9f9f9;
}

.tarjeta {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    margin-bottom: 20px;
}

.seccion-usuario {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #eee;
}

.grupo-campo {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
    color: #333;
}

select, input, textarea {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
}

textarea {
    resize: vertical;
    height: 80px;
}

button {
    background-color: #28a745;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background-color: #218838;
}

.alerta-error {
    color: #d9534f;
    text-align: center;
}
</style>

</head>

<body>

<div id="contenido"></div>

<div id="acciones" class="tarjeta" style="margin-top:20px"></div>

<script>
// 1. Obtener el ID de la obra desde la URL
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get('id');

// ID de usuario simulado
const usuarioId = 1; 

async function cargarTodo() {
    if (!id) {
        document.getElementById("contenido").innerHTML = `
            <div class="tarjeta alerta-error">
                <h3>Atención</h3>
                <p>No se ha especificado ninguna obra en la URL.</p>
                <p>Prueba a entrar escribiendo: <code>http://localhost:8080/work.html?id=1</code></p>
            </div>`;
        return;
    }

    const obraEncontrada = await cargarObra();
    
    if (obraEncontrada) {
        await cargarInteraccionesUsuario();
    }
}

async function cargarObra() {
    try {
        // Usamos ruta relativa limpia
        const respuesta = await fetch("/work/" + id);
        
        if (!respuesta.ok) {
            document.getElementById("contenido").innerHTML = `
                <div class="tarjeta alerta-error">
                    <h2>Obra no encontrada</h2>
                    <p>No existe ninguna obra con el ID <b>${id}</b> en la base de datos.</p>
                </div>`;
            return false;
        }

        const obra = await respuesta.json();

        document.getElementById("contenido").innerHTML = `
            <div class="tarjeta">
                <h1>${obra.titulo}</h1>
                <p><b>Autor:</b> ${obra.autor}</p>
                <p><b>Tipo:</b> ${obra.tipo}</p>
                <p>${obra.descripcion}</p>

                <div class="seccion-usuario">
                    <h3>Mi Experiencia</h3>
                    
                    <div class="grupo-campo">
                        <label for="select-estado">Estado:</label>
                        <select id="select-estado" onchange="guardarEstado()">
                            <option value="">Selecciona un estado...</option>
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="EN_CURSO">En curso</option>
                            <option value="COMPLETADA">Completada</option>
                            <option value="ABANDONADA">Abandonada</option>
                        </select>
                    </div>

                    <div class="grupo-campo">
                        <label for="input-valoracion">Valoración (1 al 5):</label>
                        <input type="number" id="input-valoracion" min="1" max="5" placeholder="Ej: 4">
                    </div>

                    <div class="grupo-campo">
                        <label for="textarea-resena">Reseña:</label>
                        <textarea id="textarea-resena" placeholder="Escribe tu opinión sobre la obra..."></textarea>
                    </div>

                    <button onclick="guardarValoracionYResena()">Guardar Valoración y Reseña</button>
                </div>
            </div>
        `;
        return true;
    } catch (error) {
        console.error("Error al cargar la obra:", error);
        document.getElementById("contenido").innerHTML = `
            <div class="tarjeta alerta-error">
                <h3>Error de conexión</h3>
                <p>No se ha podido conectar con el servidor backend.</p>
            </div>`;
        return false;
    }
}

async function cargarInteraccionesUsuario() {
    try {
        const resEstado = await fetch(`/users/${usuarioId}/works/${id}/estado`);
        if (resEstado.ok) {
            const estado = await resEstado.json();
            if (estado) document.getElementById("select-estado").value = estado;
        }
    } catch (e) { console.log("Sin estado previo"); }

    try {
        const resVal = await fetch(`/api/valoraciones/obra/${id}/usuario/${usuarioId}`);
        if (resVal.ok) {
            const val = await resVal.json();
            if (val && val.puntuacion) {
                document.getElementById("input-valoracion").value = val.puntuacion;
            }
        }
    } catch (e) { console.log("Sin valoración previa"); }

    try {
        const resRes = await fetch(`/api/resenas/obra/${id}/usuario/${usuarioId}`);
        if (resRes.ok) {
            const resena = await resRes.json();
            if (resena && resena.texto) {
                document.getElementById("textarea-resena").value = resena.texto;
            }
        }
    } catch (e) { console.log("Sin reseña previa"); }
}

async function guardarEstado() {
    const nuevoEstado = document.getElementById("select-estado").value;
    try {
        const res = await fetch(`/users/${usuarioId}/works/${id}/estado?estado=${nuevoEstado}`, {
            method: 'PUT'
        });
        if (res.ok) {
            console.log("Estado actualizado con éxito");
        }
    } catch (e) {
        console.error("Error al actualizar estado:", e);
    }
}

async function guardarValoracionYResena() {
    const puntuacion = document.getElementById("input-valoracion").value;
    const textoResena = document.getElementById("textarea-resena").value;

    let exito = true;

    if (puntuacion) {
        const resVal = await fetch(`/api/valoraciones`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuarioId: usuarioId, obraId: parseInt(id), puntuacion: parseInt(puntuacion) })
        });
        if (!resVal.ok) exito = false;
    }

    if (textoResena) {
        const resRes = await fetch(`/api/resenas`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuarioId: usuarioId, obraId: parseInt(id), texto: textoResena })
        });
        if (!resRes.ok) exito = false;
    }

    if (exito) {
        alert("¡Valoración y reseña guardadas correctamente!");
    } else {
        alert("Hubo algún error al guardar los datos.");
    }
}

cargarTodo();
</script>

<script>
(function () {

    const obraId = Number(
        new URLSearchParams(window.location.search).get("id"));

    const caja = document.getElementById("acciones");

    // Llama a la API y devuelve estado y datos, sin redirigir.
    async function llamar(url, opciones) {
        const respuesta = await fetch(
            url,
            Object.assign({ credentials: "same-origin" }, opciones));

        const texto = await respuesta.text();
        let datos = null;

        if (texto) {
            try {
                datos = JSON.parse(texto);
            } catch (e) {
                datos = texto;
            }
        }

        return { ok: respuesta.ok, status: respuesta.status, datos: datos };
    }

    function crear(etiqueta, texto) {
        const el = document.createElement(etiqueta);
        if (texto !== undefined) {
            el.textContent = texto;
        }
        return el;
    }

    async function iniciar() {

        if (!Number.isInteger(obraId) || obraId < 1) {
            return;
        }

        const favoritos = await llamar("/api/favoritos");

        // Sin sesión: la ficha sigue siendo pública, pero avisamos.
        if (favoritos.status === 401 || favoritos.status === 403) {
            const aviso = crear("p", "Inicia sesión para fijar esta obra "
                + "como favorita o añadirla a tus listas. ");
            const enlace = crear("a", "Iniciar sesión");
            enlace.href = "login.html";
            aviso.appendChild(enlace);
            caja.appendChild(aviso);
            return;
        }

        const mensaje = crear("p");
        mensaje.style.fontWeight = "bold";

        function mostrar(texto, correcto) {
            mensaje.textContent = texto;
            mensaje.style.color = correcto ? "green" : "red";
        }

        // ----- Favorito -----

        let esFavorita = Array.isArray(favoritos.datos)
            && favoritos.datos.some(f => f.obraId === obraId);

        const botonFav = crear("button");
        botonFav.type = "button";
        botonFav.style.cursor = "pointer";

        function textoBotonFav() {
            botonFav.textContent = esFavorita
                ? "⭐ Quitar de favoritos"
                : "☆ Fijar como favorita";
        }

        textoBotonFav();

        botonFav.addEventListener("click", async function () {
            const resultado = await llamar("/api/favoritos/" + obraId,
                { method: esFavorita ? "DELETE" : "POST" });

            if (resultado.ok) {
                esFavorita = !esFavorita;
                textoBotonFav();
                mostrar(esFavorita
                    ? "Obra fijada como favorita."
                    : "Obra quitada de favoritos.", true);
            } else {
                mostrar(typeof resultado.datos === "string"
                    ? resultado.datos
                    : "No se ha podido completar la acción.", false);
            }
        });

        caja.appendChild(botonFav);

        // ----- Listas -----

        caja.appendChild(crear("h3", "Añadir a mis listas"));

        const listas = await llamar("/api/listas/obra/" + obraId);

        if (!listas.ok || !Array.isArray(listas.datos)
                || listas.datos.length === 0) {

            const vacio = crear("p", "Todavía no tienes listas. ");
            const enlace = crear("a", "Créalas en tu perfil");
            enlace.href = "perfil.html";
            vacio.appendChild(enlace);
            caja.appendChild(vacio);

        } else {
            listas.datos.forEach(lista => {
                const etiqueta = crear("label");
                etiqueta.style.display = "block";
                etiqueta.style.margin = "6px 0";

                const casilla = document.createElement("input");
                casilla.type = "checkbox";
                casilla.checked = lista.contieneObra;

                // Cada clic se guarda al momento (sin botón Guardar).
                casilla.addEventListener("change", async function () {
                    const resultado = await llamar(
                        "/api/listas/" + lista.id + "/obras/" + obraId,
                        { method: casilla.checked ? "POST" : "DELETE" });

                    if (resultado.ok) {
                        mostrar(casilla.checked
                            ? "Añadida a \"" + lista.nombre + "\"."
                            : "Quitada de \"" + lista.nombre + "\".", true);
                    } else {
                        // Si falla, devolvemos la casilla a su estado.
                        casilla.checked = !casilla.checked;
                        mostrar(typeof resultado.datos === "string"
                            ? resultado.datos
                            : "No se ha podido guardar el cambio.", false);
                    }
                });

                etiqueta.appendChild(casilla);
                etiqueta.appendChild(
                    document.createTextNode(" " + lista.nombre));
                caja.appendChild(etiqueta);
            });
        }

        caja.appendChild(mensaje);

        const enlacePerfil = crear("a", "Ir a mi perfil");
        enlacePerfil.href = "perfil.html";
        caja.appendChild(enlacePerfil);
    }

    iniciar();

})();
</script>

</body>
</html>
